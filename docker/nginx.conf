server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # The browser talks only to the frontend origin. Nginx forwards API calls
    # through the private Compose network, so there is no CORS boundary here.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    # Django-owned static content, kept separate from Create React App's
    # /static/* assets.
    location /django-static/ {
        proxy_pass http://backend:8000/django-static/;
        proxy_set_header Host $host;
    }

    # React Router / SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
