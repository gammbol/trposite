server {
    listen 80;
    server_name localhost 127.0.0.1 _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # This Compose stack is deliberately HTTP-only. Keep the original Host
    # header INCLUDING :8080, otherwise Django Admin's CSRF origin check sees a
    # different origin than the browser.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
    }

    # Django admin/DRF static assets are collected inside the backend image and
    # served by WhiteNoise through this proxy path.
    location /django-static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_redirect off;
    }

    # React Router SPA fallback. /history and the other client-side routes are
    # served as index.html and routed by React in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
