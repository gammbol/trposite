[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts = -ra --strict-markers --strict-config
markers =
    unit: isolated unit tests for pure business logic
    integration: Django/DRF integration tests
    differential: compare independent solver candidates against trusted invariants
    property: property-based generated ODE tests
    fuzz: malformed/randomized input robustness tests
    resilience: provider outage, timeout and self-correction failure tests
    regression: previously identified edge cases
    slow: slower test that may perform many symbolic operations
